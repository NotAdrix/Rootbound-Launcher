[package]
name = "rootbound-launcher"
version = "1.0.0-alpha"
edition = "2021"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.21"
winreg = "0.52"
eframe = "0.27"
sysinfo = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.14"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tray-icon = { version = "0.26.1", default-features = false }
sha2 = "0.11.1"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
strip = true
