[package]
name = "rootbound-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
winreg = "0.52"
eframe = "0.27"
sysinfo = "0.30"
image = "0.25"
rfd = "0.14"

[build-dependencies]
winres = "0.1"
